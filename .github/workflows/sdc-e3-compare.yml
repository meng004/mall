# E3 示例分支推送时，用同一组测试对照基线（改前）与示例（改后）。
# 规格先行的示例必须改前失败、改后通过。测试参数取自示例已提交的 compare.txt 第一行。
name: E3 改前/改后对照
on:
  push:
    branches: ['exp/e3-*']
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: 启动课程 MySQL（13306，导入 mall.sql）
        run: |
          C="docker compose -f SDC/environment/compose.yml"
          $C up -d mysql
          for i in $(seq 60); do
            $C exec -T mysql sh -c 'mysql -umall -p"$MYSQL_PASSWORD" -e "select 1 from mall.pms_product_attribute limit 1"' >/dev/null 2>&1 && exit 0
            sleep 5
          done
          $C logs mysql | tail -30; exit 1
      - name: 改前/改后对照
        env:
          MVN_OFFLINE: ''
        run: |
          ID=$(echo "${GITHUB_REF_NAME#exp/}" | tr a-z A-Z)
          read -r MODULE TESTS <<<"$(head -1 "SDC/E3/outputs/$ID/evidence/compare.txt" | sed 's/^测试：//')"
          SDC/E3/compare.sh "$MODULE" "$TESTS" /tmp/compare.txt
          { echo '```'; cat /tmp/compare.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q '^改前 .* exit=[1-9]' /tmp/compare.txt || { echo "::error::改前应失败"; exit 1; }
          grep -q '^改后 .* exit=0 ' /tmp/compare.txt || { echo "::error::改后应通过"; exit 1; }
