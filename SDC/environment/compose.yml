name: sdc-classroom
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: sdc-local-root
      MYSQL_DATABASE: mall
      MYSQL_USER: mall
      MYSQL_PASSWORD: sdc-local-app
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["127.0.0.1:13306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../document/sql/mall.sql:/docker-entrypoint-initdb.d/01-mall.sql:ro
  redis:
    image: redis:7
    ports: ["127.0.0.1:16379:6379"]
  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27018:27017"]
    volumes: ["mongo-data:/data/db"]
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: mall
      RABBITMQ_DEFAULT_PASS: mall
      RABBITMQ_DEFAULT_VHOST: /mall
    ports: ["127.0.0.1:5673:5672", "127.0.0.1:15673:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
volumes:
  mysql-data:
  mongo-data:
  rabbit-data:
